[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-epm"
version = "0.2.0"
description = "Embedding-aware polarization measurement and mitigation for signed graphs"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "networkx>=2.8",
  "torch>=2.0",
  "torch-geometric-signed-directed==1.1.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
signed-epm-preprocess = "signed_epm.data.preprocess:main"
signed-epm-communities = "signed_epm.data.communities:main"
signed-epm-train = "signed_epm.training.train:main"
signed-epm-tune = "signed_epm.training.tune:main"
signed-epm-measure = "signed_epm.polarization.measure:main"
signed-epm-prepare = "signed_epm.experiments.prepare_mitigation:main"
signed-epm-sample-candidates = "signed_epm.experiments.canonical_candidate_pool:main"
signed-epm-select = "signed_epm.experiments.pooled_greedy:main"
signed-epm-materialize = "signed_epm.experiments.materialize_sampled_batch:main"
signed-epm-random = "signed_epm.experiments.materialize_uniform_random:main"
signed-epm-graph-wide = "signed_epm.experiments.global_greedy_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
