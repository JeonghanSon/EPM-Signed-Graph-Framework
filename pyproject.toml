[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signed-epm"
version = "0.1.0"
description = "Model-agnostic polarization measurement and mitigation for signed graphs"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "networkx>=2.8",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "torch>=2.0",
  "torch-geometric-signed-directed>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
signed-epm-preprocess = "signed_epm.data.preprocess:main"
signed-epm-communities = "signed_epm.data.communities:main"
signed-epm-train = "signed_epm.training.train:main"
signed-epm-tune = "signed_epm.training.tune:main"
signed-epm-measure = "signed_epm.polarization.measure:main"
signed-epm-prepare = "signed_epm.mitigation.prepare:main"
signed-epm-sample-candidates = "signed_epm.mitigation.sample_candidates:main"
signed-epm-select = "signed_epm.mitigation.greedy:main"
signed-epm-select-batch = "signed_epm.mitigation.batch_greedy:main"
signed-epm-materialize = "signed_epm.mitigation.materialize:main"
signed-epm-collect-results = "signed_epm.evaluation.collect_results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
